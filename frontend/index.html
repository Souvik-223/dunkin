    <!-- Immediate theme check to prevent flash -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('spotter_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
